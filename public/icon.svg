<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f2547"/>
      <stop offset="100%" stop-color="#050b16"/>
    </radialGradient>
    <linearGradient id="topBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e6c"/>
      <stop offset="45%" stop-color="#ef233c"/>
      <stop offset="100%" stop-color="#9e0b22"/>
    </linearGradient>
    <linearGradient id="botBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanQ" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Outer glow -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4"/>
  <!-- Bottom half -->
  <path d="M18 64 A46 46 0 0 0 110 64 Z" fill="url(#botBall)"/>
  <!-- Top half -->
  <path d="M18 64 A46 46 0 0 1 110 64 Z" fill="url(#topBall)"/>
  <!-- Gloss highlight -->
  <ellipse cx="48" cy="34" rx="18" ry="8" transform="rotate(-22 48 34)" fill="#ffffff" fill-opacity="0.38"/>
  <!-- Center band -->
  <rect x="18" y="59" width="92" height="10" fill="#0f172a"/>
  <line x1="18" y1="59" x2="110" y2="59" stroke="url(#goldTrim)" stroke-width="2"/>
  <line x1="18" y1="69" x2="110" y2="69" stroke="url(#goldTrim)" stroke-width="2"/>
  <!-- Center button -->
  <circle cx="64" cy="64" r="16" fill="#0f172a" stroke="url(#goldTrim)" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="10" fill="#e2e8f0"/>
  <!-- Electric Cyan Question Mark -->
  <g filter="url(#glow)">
    <path d="M52 46 C52 36, 77 36, 77 49 C77 57, 64 59, 64 68" fill="none" stroke="url(#goldTrim)" stroke-width="11" stroke-linecap="round"/>
    <path d="M52 46 C52 36, 77 36, 77 49 C77 57, 64 59, 64 68" fill="none" stroke="url(#cyanQ)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="64" cy="83" r="6" fill="url(#cyanQ)" stroke="url(#goldTrim)" stroke-width="2.5"/>
  </g>
</svg>
